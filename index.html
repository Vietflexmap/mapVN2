<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1724" />
  <title>Bản đồ nền Việt Nam</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3yn6oX+8nK+aO9z1p+8C/PqWON5+M="
    crossorigin=""
  />

  <style>
    :root {
      --panel: rgba(8, 20, 33, 0.90);
      --border: rgba(255,255,255,0.16);
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    * { box-sizing: border-box; }

    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1724;
    }

    #map {
      position: fixed;
      inset: 0;
      background: #d9e4ea;
    }

    .map-title {
      position: fixed;
      z-index: 1000;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .2px;
      white-space: nowrap;
      pointer-events: none;
    }

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: 0 8px 24px rgba(0,0,0,.18) !important;
    }

    .leaflet-control-zoom a {
      background: var(--panel) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .leaflet-control-zoom a:hover {
      background: rgba(17, 35, 54, .96) !important;
    }

    .leaflet-popup,
    .leaflet-control-attribution {
      display: none !important;
    }

    @media (max-width: 600px) {
      .map-title {
        top: max(10px, env(safe-area-inset-top));
        padding: 8px 13px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div id="map" aria-label="Bản đồ nền Việt Nam"></div>
  <div class="map-title">Bản đồ nền Việt Nam</div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <script>
    (() => {
      'use strict';

      const WMS_URL = 'https://cache.bando.com.vn/service';

      const map = L.map('map', {
        center: [16.3, 106.0],
        zoom: 6,
        minZoom: 4,
        maxZoom: 19,
        zoomControl: true,
        attributionControl: false,
        preferCanvas: true
      });

      const vietnamBasemap = L.tileLayer.wms(WMS_URL, {
        layers: 'vietnam_2026',
        format: 'image/png',
        transparent: true,
        version: '1.1.1',
        tiled: true,
        uppercase: true
      });

      vietnamBasemap.addTo(map);

      map.on('tileerror', () => {
        console.warn('Không tải được một hoặc nhiều tile WMS từ nguồn bản đồ.');
      });
    })();
  </script>
</body>
</html>
