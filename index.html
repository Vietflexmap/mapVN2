<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07192b">
<title>Bản đồ nền Việt Nam</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--nav:#07192b;--nav2:#0c2238;--panel:#0d2034f5;--line:#35506b;--red:#ff3b30;--yellow:#ffd84d;--text:#eef6ff;--muted:#9fb1c4;--blue:#2185f5}
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;background:#d8e5ea;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text)}
#map{position:fixed;inset:64px 0 0;background:#d8e5ea}
.topbar{position:fixed;z-index:3000;inset:0 0 auto;height:64px;display:flex;align-items:stretch;background:linear-gradient(180deg,#0a2035,#061727);border-bottom:1px solid #29455f;box-shadow:0 5px 18px #0005}
.brand{height:64px;min-width:210px;display:flex;align-items:center;padding:0 18px;border-right:1px solid #2d465d;white-space:nowrap}.brand-mark{width:34px;height:34px;border-radius:9px;background:#991c19;display:grid;place-items:center;margin-right:10px;color:var(--yellow);font-weight:900}.brand b{display:block;color:var(--yellow);font-size:14px;letter-spacing:.2px}.brand small{display:block;color:#8fa8bd;font-size:10px;margin-top:2px}
.toolbar{display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;flex:1}.tool{min-width:84px;height:64px;padding:6px 9px 5px;border:0;border-right:1px solid #203b53;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.15s}.tool:hover,.tool.active{background:#122c45}.tool.active{box-shadow:inset 0 -3px var(--red)}.tool svg{width:24px;height:24px;fill:none;stroke:var(--red);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}.tool span{color:var(--yellow);font-size:10.5px;font-weight:700;white-space:nowrap}.tool:focus-visible{outline:2px solid var(--yellow);outline-offset:-3px}
.panel{position:fixed;z-index:2700;top:74px;left:50%;transform:translateX(-50%) translateY(-6px);width:min(430px,calc(100vw - 24px));max-height:calc(100vh - 112px);overflow:auto;background:var(--panel);border:1px solid #3a536b;border-radius:16px;box-shadow:0 20px 50px #0008;backdrop-filter:blur(13px);display:none;opacity:0}.panel.open{display:block;animation:panelin .15s ease forwards}@keyframes panelin{to{opacity:1;transform:translateX(-50%) translateY(0)}}
.panel.route{width:min(520px,calc(100vw - 24px))}.panel.small{width:min(360px,calc(100vw - 24px))}.panel-head{position:sticky;top:0;z-index:5;min-height:54px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;background:#102943;border-bottom:1px solid #36516a}.panel-title{display:flex;align-items:center;gap:9px;color:var(--yellow);font-weight:800}.panel-title svg{width:22px;height:22px;stroke:var(--red);fill:none;stroke-width:2.3}.xbtn{width:32px;height:32px;border:1px solid #425d76;border-radius:9px;background:#1b354f;color:#fff;font-size:21px;cursor:pointer}.panel-body{padding:13px 15px 15px}.section-title{margin:8px 0 6px;color:#a7b8c9;font-size:10.5px;text-transform:uppercase;letter-spacing:.75px;font-weight:800}.row{display:flex;align-items:center;gap:9px;padding:8px 0}.row label{flex:1;font-size:12px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.swatch{width:15px;height:15px;border-radius:4px;flex:0 0 auto}.slider-row{display:flex;align-items:center;gap:8px;padding:2px 0 8px 29px}.slider-row input{flex:1;accent-color:var(--blue)}.percent{width:38px;text-align:right;color:#aebfd0;font-size:11px}.divider{height:1px;background:#30485f;margin:9px 0}
input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:16px;height:16px}.field{margin:9px 0}.field label{display:block;margin-bottom:5px;color:#b8c8d7;font-size:11px;font-weight:700}.input,.select{width:100%;height:42px;border:1px solid #52677a;border-radius:10px;background:#f7f9fc;color:#27384a;padding:0 11px;font-size:13px;outline:none}.input:focus,.select:focus{border-color:#2c8dff;box-shadow:0 0 0 3px #2185f526}.input-group{display:flex;gap:7px}.input-group .input{flex:1}.pick{width:45px;border:2px solid #2787f5;border-radius:11px;background:#f7f9fc;color:#1775df;font-weight:900;cursor:pointer}.route-badge{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;margin-right:4px}.a{background:#22b765}.b{background:#ec473e}
.action{width:100%;min-height:43px;border-radius:10px;border:1px solid #4c6177;background:#172f49;color:#e9f2fb;font-weight:750;cursor:pointer;margin-top:7px}.action:hover{filter:brightness(1.12)}.action.primary{background:linear-gradient(135deg,#1674db,#3d91fa);border-color:#459dff;color:#fff}.action.danger{background:#fff1f0;border:2px solid #ff554b;color:#e5362e}.action.gold{border-color:#7a6320;color:var(--yellow)}.action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{margin-top:9px;padding:9px 10px;border:1px solid #3b5972;border-radius:10px;background:#102b44;color:#bcd0e1;font-size:10.5px;line-height:1.45}.result{margin-top:10px;padding:10px;border-radius:10px;background:#0b1c2e;border:1px solid #304b65;font-size:11px;line-height:1.55;color:#cbd9e6;display:none}.result.show{display:block}
.status{position:fixed;z-index:2400;right:18px;bottom:16px;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #52677a;border-radius:18px;background:#15354eea;color:#c6d4e0;box-shadow:0 7px 24px #0005;font-size:11.5px;backdrop-filter:blur(8px)}.status .pin{color:var(--red);font-weight:900}.status .vline{width:1px;height:18px;background:#ffffff2c}.scale-edit{display:flex;align-items:center;gap:5px}.scale-edit input{width:94px;background:#0d263d;border:1px solid #5b7084;border-radius:6px;color:#fff;padding:4px 6px;font:700 11px ui-monospace,Consolas,monospace}
.measure-tip{position:fixed;z-index:2450;left:18px;bottom:72px;display:none;padding:8px 10px;border-radius:9px;background:#0b2034ec;border:1px solid #456078;color:#fff;font-size:11px}.measure-tip.show{display:block}.leaflet-control-attribution{display:none!important}.leaflet-control-zoom{display:none!important}.leaflet-control-scale{margin-left:18px!important;margin-bottom:17px!important}.leaflet-control-scale-line{background:#ffffffdb!important;border-color:#334b61!important;color:#102236!important;font-size:10px!important}.leaflet-popup{display:none!important}
.legend-card{position:fixed;z-index:2550;right:18px;top:82px;width:298px;max-width:calc(100vw - 36px);background:#fff;border:1px solid #b7c3cd;border-radius:12px;box-shadow:0 12px 35px #0005;overflow:hidden;color:#16202a}.legend-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#0e2941;color:var(--yellow);font-size:12px;font-weight:800}.legend-head button{border:0;background:#ffffff18;color:white;border-radius:7px;width:27px;height:27px;cursor:pointer;font-size:17px}.legend-img{display:block;width:100%;height:auto;background:#fff}.legend-card.collapsed .legend-img{display:none}.legend-card.collapsed{width:170px}.label-badge{position:fixed;z-index:2450;right:18px;top:72px;display:none}.label-state{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#09233be8;border:1px solid #31516c;color:#cfe2f2;font-size:10px}.label-state .dot{width:7px;height:7px;border-radius:50%;background:#28c76f}
.designer-credit{position:fixed;z-index:2450;left:4px;bottom:4px;padding:6px 10px;border-radius:10px;background:#0e2941dc;border:1px solid #48627a;color:var(--yellow);font-size:10.5px;font-weight:700;letter-spacing:.2px;box-shadow:0 5px 18px #0004;backdrop-filter:blur(8px);pointer-events:none}
.dot-icon{background:transparent;border:0}.route-pin{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 12px Arial;border:2px solid white;box-shadow:0 2px 8px #0007}.route-pin.a{background:#22b765}.route-pin.b{background:#ec473e}
@media(max-width:860px){.brand{min-width:150px;padding:0 10px}.brand small{display:none}.tool{min-width:68px}.tool span{font-size:9.5px}.legend-card{width:250px}}
@media(max-width:620px){#map{inset:56px 0 0}.topbar{height:56px}.brand{height:56px;min-width:122px}.brand-mark{width:29px;height:29px}.brand b{font-size:11px}.toolbar{height:56px}.tool{height:56px;min-width:59px;padding:4px}.tool svg{width:21px;height:21px}.tool span{font-size:8.5px}.panel{top:65px;max-height:calc(100vh - 112px)}.status{left:8px;right:8px;bottom:8px;justify-content:center;font-size:10px}.scale-edit input{width:78px}.leaflet-control-scale{margin-left:8px!important;margin-bottom:55px!important}.measure-tip{left:8px;bottom:58px}.designer-credit{left:4px;bottom:4px;font-size:9.5px}.action-row{grid-template-columns:1fr}.legend-card{top:66px;right:8px;width:220px;max-height:calc(100vh - 132px);overflow:auto}}
</style>
</head>
<body>
<div id="map" aria-label="Bản đồ nền Việt Nam"></div>
<header class="topbar">
  <div class="brand"><div class="brand-mark">VN</div><div><b>Bản đồ nền Việt Nam</b><small>WebGIS trực tuyến</small></div></div>
  <nav class="toolbar" aria-label="Công cụ bản đồ">
    <button class="tool" id="homeBtn" title="Toàn quốc"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10.5V20h13v-9.5M9.5 20v-6h5v6"/></svg><span>Toàn quốc</span></button>
    <button class="tool" id="zoomInBtn" title="Phóng to"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Phóng to</span></button>
    <button class="tool" id="zoomOutBtn" title="Thu nhỏ"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg><span>Thu nhỏ</span></button>
    <button class="tool" id="fullBtn" title="Toàn màn hình"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span>Toàn màn hình</span></button>
    <button class="tool" id="layersBtn" data-panel="layersPanel"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span>Lớp bản đồ</span></button>
    <button class="tool" id="legendBtn" title="Chú giải"><svg viewBox="0 0 24 24"><path d="M4 5h4v4H4zM11 7h9M4 12h4v4H4zM11 14h9M4 19h4M11 19h9"/></svg><span>Chú giải</span></button>
    <button class="tool" id="drawBtn" data-panel="drawPanel"><svg viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16v4ZM13.5 6.5l4 4"/></svg><span>Vẽ</span></button>
    <button class="tool" id="measureBtn" data-panel="measurePanel"><svg viewBox="0 0 24 24"><path d="M4 19 19 4l2 2L6 21H4v-2ZM9 14l2 2M12 11l2 2M15 8l2 2"/></svg><span>Đo đạc</span></button>
    <button class="tool" id="routeBtn" data-panel="routePanel"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h3c4 0 4-6 8-6h1M5 16V8c0-2 2-3 4-3h3"/></svg><span>Tìm đường</span></button>
    <button class="tool" id="locateBtn" title="Vị trí của tôi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Vị trí</span></button>
  </nav>
</header>

<section class="panel" id="layersPanel">
 <div class="panel-head"><div class="panel-title"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5"/></svg>Lớp bản đồ</div><button class="xbtn" data-close>×</button></div>
 <div class="panel-body">
  <div class="section-title">Lớp nền bản đồ</div>
  <div class="row"><input type="radio" name="base" id="baseTerrain" checked><span class="swatch" style="background:#a77f6d"></span><label for="baseTerrain">Ảnh địa hình (ESRI Terrain)<small>Nền tham chiếu địa hình</small></label></div>
  <div class="row"><input type="radio" name="base" id="baseSatellite"><span class="swatch" style="background:#25b862"></span><label for="baseSatellite">Ảnh vệ tinh (ESRI)<small>World Imagery</small></label></div>
  <div class="row"><input type="radio" name="base" id="baseNone"><span class="swatch" style="background:#687b8d"></span><label for="baseNone">Không dùng lớp nền</label></div>
  <div class="divider"></div>
  <div class="section-title">Lớp phủ bản đồ</div>
  <div class="row"><input type="checkbox" id="wmsVisible" checked><span class="swatch" style="background:#12a9bb"></span><label for="wmsVisible"><b>Bản đồ nền Việt Nam</b></label></div>
  <div class="slider-row"><span>◐</span><input id="wmsOpacity" type="range" min="0" max="100" value="100"><span class="percent" id="wmsPct">100%</span></div>
  <div class="row"><input type="checkbox" id="labelsVisible" checked><span class="swatch" style="background:#fff;border:1px solid #8899aa"></span><label for="labelsVisible"><b>Nhãn bản đồ đầy đủ</b><small>Tỉnh, xã/phường, sông suối, địa danh...</small></label></div>
  <div class="slider-row"><span>◐</span><input id="labelsOpacity" type="range" min="0" max="100" value="100"><span class="percent" id="labelsPct">100%</span></div>
 </div>
</section>

<section class="panel small" id="drawPanel"><div class="panel-head"><div class="panel-title">✎ Vẽ dữ liệu</div><button class="xbtn" data-close>×</button></div><div class="panel-body"><button class="action" data-draw="marker">Vẽ điểm</button><button class="action" data-draw="line">Vẽ tuyến</button><button class="action" data-draw="polygon">Vẽ vùng</button><button class="action danger" id="clearDraw">Xóa dữ liệu vẽ</button><div class="notice">Click để thêm đỉnh. Double-click để kết thúc tuyến/vùng.</div></div></section>
<section class="panel small" id="measurePanel"><div class="panel-head"><div class="panel-title">⌁ Đo đạc</div><button class="xbtn" data-close>×</button></div><div class="panel-body"><button class="action" data-measure="length">Đo chiều dài</button><button class="action" data-measure="area">Đo diện tích</button><button class="action danger" id="clearMeasure">Xóa kết quả đo</button><div class="result" id="measureResult"></div></div></section>
<section class="panel route" id="routePanel"><div class="panel-head"><div class="panel-title">⌁ Tìm đường</div><button class="xbtn" data-close>×</button></div><div class="panel-body"><div class="field"><label><span class="route-badge a">A</span> Điểm đầu</label><div class="input-group"><input class="input" id="routeA" placeholder="VD: 21.028511, 105.804817 hoặc Hà Nội"><button class="pick" data-pick="A">⌖</button></div></div><button class="action gold" id="swapRoute">⇄ Đổi điểm đầu / điểm cuối</button><div class="field"><label><span class="route-badge b">B</span> Điểm cuối</label><div class="input-group"><input class="input" id="routeB" placeholder="VD: 10.823099, 106.629664 hoặc TP.HCM"><button class="pick" data-pick="B">⌖</button></div></div><button class="action primary" id="calcRoute">Tính tuyến đường</button><button class="action danger" id="clearRoute">Xóa tuyến đường</button><div class="result" id="routeResult"></div></div></section>

<div class="legend-card" id="legendCard"><div class="legend-head"><span>CHÚ GIẢI</span><button id="legendCollapse" title="Thu gọn">−</button></div><img class="legend-img" src="https://cosodulieu.bando.com.vn/static/map/images/cg6.jpg" alt="Chú giải Bản đồ nền Việt Nam"></div>
<div class="designer-credit">Long Ngo thiết kế</div>
<div class="status"><span class="pin">●</span><span id="coord">0.00000° 0.00000°</span><span class="vline"></span><div class="scale-edit"><span>1:</span><input id="scaleInput" inputmode="numeric" value=""></div></div>
<div class="measure-tip" id="measureTip"></div>

<script>
(() => {
'use strict';
const WMS_URL='https://cache.bando.com.vn/service';
const map=L.map('map',{center:[16,106],zoom:6,minZoom:4,maxZoom:18,zoomControl:false,attributionControl:false,preferCanvas:true});
L.control.scale({imperial:false,metric:true,maxWidth:180,position:'bottomleft'}).addTo(map);
map.createPane('wmsBasePane'); map.getPane('wmsBasePane').style.zIndex=360;
map.createPane('wmsLabelPane'); map.getPane('wmsLabelPane').style.zIndex=460; map.getPane('wmsLabelPane').style.pointerEvents='none';
map.createPane('drawingPane'); map.getPane('drawingPane').style.zIndex=650;

const terrain=L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:18});
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
terrain.addTo(map);

class ViewportWMS {
  constructor(layerName,pane,{buffer=0,maxSize=2200}={}){this.layerName=layerName;this.pane=pane;this.buffer=buffer;this.maxSize=maxSize;this.visible=true;this.opacity=1;this.current=null;this.seq=0;this.timer=null;}
  setVisible(v){this.visible=!!v;if(this.current)this.current.setOpacity(this.visible?this.opacity:0);if(this.visible)this.schedule(0);}
  setOpacity(v){this.opacity=Math.max(0,Math.min(1,v));if(this.current)this.current.setOpacity(this.visible?this.opacity:0);}
  schedule(ms=110){clearTimeout(this.timer);this.timer=setTimeout(()=>this.load(),ms);}
  makeRequest(attempt=0){
    const bounds=map.getBounds(); let b=bounds;
    if(this.buffer>0){const sw=bounds.getSouthWest(),ne=bounds.getNorthEast(),dlat=(ne.lat-sw.lat)*this.buffer,dlng=(ne.lng-sw.lng)*this.buffer;b=L.latLngBounds([sw.lat-dlat,sw.lng-dlng],[ne.lat+dlat,ne.lng+dlng]);}
    const nw=map.options.crs.project(b.getNorthWest()), se=map.options.crs.project(b.getSouthEast());
    const size=map.getSize(); const factor=this.buffer>0?1+this.buffer*2:1;
    let width=Math.max(256,Math.round(size.x*factor)),height=Math.max(256,Math.round(size.y*factor));
    const m=Math.max(width,height);if(m>this.maxSize){const r=this.maxSize/m;width=Math.round(width*r);height=Math.round(height*r);}
    const params=new URLSearchParams({SERVICE:'WMS',REQUEST:'GetMap',VERSION:'1.1.1',LAYERS:this.layerName,STYLES:'',FORMAT:'image/png',TRANSPARENT:'true',TILED:'false',WIDTH:String(width),HEIGHT:String(height),SRS:'EPSG:3857',BBOX:[nw.x,se.y,se.x,nw.y].join(','),_v:String(Date.now()+attempt)});
    return {url:WMS_URL+'?'+params.toString(),bounds:b};
  }
  load(){
    if(!this.visible)return; const token=++this.seq; const req=this.makeRequest(0); const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{if(token!==this.seq)return;const next=L.imageOverlay(req.url,req.bounds,{pane:this.pane,opacity:0,interactive:false});next.addTo(map);requestAnimationFrame(()=>next.setOpacity(this.opacity));const old=this.current;this.current=next;if(old)setTimeout(()=>map.removeLayer(old),180);};
    img.onerror=()=>{if(token!==this.seq)return;setTimeout(()=>{if(token===this.seq)this.load();},700);};
    img.src=req.url;
  }
}

// Website gốc thực tế tách hai lớp: vietnam_2026 + vietnam_label_2026.
const vnMap=new ViewportWMS('vietnam_2026','wmsBasePane',{buffer:.12,maxSize:2200});
const vnLabels=new ViewportWMS('vietnam_label_2026','wmsLabelPane',{buffer:0,maxSize:2200});
function refreshWms(){vnMap.schedule(90);vnLabels.schedule(120)}
map.on('moveend zoomend resize',refreshWms);setTimeout(refreshWms,100);

// Toolbar / panels
const panels=[...document.querySelectorAll('.panel')];
function closePanels(){panels.forEach(p=>p.classList.remove('open'));document.querySelectorAll('.tool[data-panel]').forEach(b=>b.classList.remove('active'));}
document.querySelectorAll('.tool[data-panel]').forEach(btn=>btn.addEventListener('click',()=>{const p=document.getElementById(btn.dataset.panel),was=p.classList.contains('open');closePanels();if(!was){p.classList.add('open');btn.classList.add('active');}}));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closePanels));document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});
document.getElementById('homeBtn').onclick=()=>map.setView([16,106],6);document.getElementById('zoomInBtn').onclick=()=>map.zoomIn();document.getElementById('zoomOutBtn').onclick=()=>map.zoomOut();document.getElementById('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

// Legend
const legendCard=document.getElementById('legendCard');document.getElementById('legendBtn').onclick=()=>{legendCard.style.display=legendCard.style.display==='none'?'block':'none'};document.getElementById('legendCollapse').onclick=()=>{legendCard.classList.toggle('collapsed');document.getElementById('legendCollapse').textContent=legendCard.classList.contains('collapsed')?'+':'−'};

// Layer controls
function setBase(kind){[terrain,satellite].forEach(l=>map.hasLayer(l)&&map.removeLayer(l));if(kind==='terrain')terrain.addTo(map);if(kind==='satellite')satellite.addTo(map)}
document.getElementById('baseTerrain').onchange=()=>setBase('terrain');document.getElementById('baseSatellite').onchange=()=>setBase('satellite');document.getElementById('baseNone').onchange=()=>setBase('none');
document.getElementById('wmsVisible').onchange=e=>vnMap.setVisible(e.target.checked);document.getElementById('labelsVisible').onchange=e=>vnLabels.setVisible(e.target.checked);
document.getElementById('wmsOpacity').oninput=e=>{vnMap.setOpacity(e.target.value/100);document.getElementById('wmsPct').textContent=e.target.value+'%'};document.getElementById('labelsOpacity').oninput=e=>{vnLabels.setOpacity(e.target.value/100);document.getElementById('labelsPct').textContent=e.target.value+'%'};

// Coordinates + scale
const coordEl=document.getElementById('coord'),scaleInput=document.getElementById('scaleInput');let lastLat=16;
function calcScale(lat=lastLat){const z=map.getZoom(),res=156543.03392804097*Math.cos(lat*Math.PI/180)/Math.pow(2,z);return Math.max(1,Math.round(res*96*39.37));}
function updateScale(){scaleInput.value=calcScale().toString();}
map.on('mousemove',e=>{lastLat=e.latlng.lat;coordEl.textContent=e.latlng.lat.toFixed(5)+'° '+e.latlng.lng.toFixed(5)+'°';updateScale()});map.on('zoomend',updateScale);updateScale();
scaleInput.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const target=Number(scaleInput.value.replace(/\D/g,''));if(!target)return;let best=map.getZoom(),err=Infinity;for(let z=4;z<=18;z++){const s=156543.03392804097*Math.cos(lastLat*Math.PI/180)/Math.pow(2,z)*96*39.37,d=Math.abs(Math.log(s/target));if(d<err){err=d;best=z}}map.setZoom(best)});

// Drawing / measurement
const drawGroup=L.featureGroup([], {pane:'drawingPane'}).addTo(map),measureGroup=L.featureGroup([], {pane:'drawingPane'}).addTo(map);let mode=null,pts=[],temp=null;const tip=document.getElementById('measureTip'),measureResult=document.getElementById('measureResult');
function resetMode(){mode=null;pts=[];if(temp){map.removeLayer(temp);temp=null}tip.classList.remove('show');map.doubleClickZoom.enable();}
function dist(a,b){return map.distance(a,b)}function polyArea(latlngs){if(latlngs.length<3)return 0;const R=6378137;let area=0;for(let i=0,j=latlngs.length-1;i<latlngs.length;j=i++){const p1=latlngs[j],p2=latlngs[i];area+=(p2.lng-p1.lng)*Math.PI/180*(2+Math.sin(p1.lat*Math.PI/180)+Math.sin(p2.lat*Math.PI/180));}return Math.abs(area*R*R/2)}
function fmtDistance(m){return m>=1000?(m/1000).toFixed(2)+' km':m.toFixed(1)+' m'}function fmtArea(a){return a>=1e6?(a/1e6).toFixed(2)+' km²':a.toFixed(0)+' m²'}
document.querySelectorAll('[data-draw]').forEach(b=>b.onclick=()=>{resetMode();mode='draw-'+b.dataset.draw;map.doubleClickZoom.disable();closePanels()});document.querySelectorAll('[data-measure]').forEach(b=>b.onclick=()=>{resetMode();mode='measure-'+b.dataset.measure;map.doubleClickZoom.disable();tip.textContent='Click để bắt đầu';tip.classList.add('show');closePanels()});
document.getElementById('clearDraw').onclick=()=>drawGroup.clearLayers();document.getElementById('clearMeasure').onclick=()=>{measureGroup.clearLayers();measureResult.classList.remove('show');measureResult.textContent='';resetMode()};
map.on('click',e=>{if(!mode)return;if(mode==='draw-marker'){L.circleMarker(e.latlng,{radius:6}).addTo(drawGroup);return;}pts.push(e.latlng);if(mode==='draw-line'||mode==='draw-polygon'){if(temp)map.removeLayer(temp);temp=(mode==='draw-line'?L.polyline(pts,{color:'#ff3b30'}):L.polygon(pts,{color:'#ff3b30',fillOpacity:.12})).addTo(map);} });
map.on('mousemove',e=>{if(!mode||pts.length===0)return;const p=[...pts,e.latlng];if(temp)map.removeLayer(temp);if(mode==='draw-line')temp=L.polyline(p,{color:'#ff3b30',dashArray:'6 5'}).addTo(map);if(mode==='draw-polygon')temp=L.polygon(p,{color:'#ff3b30',fillOpacity:.1,dashArray:'6 5'}).addTo(map);if(mode==='measure-length'){temp=L.polyline(p,{color:'#ffd84d',dashArray:'6 5'}).addTo(map);let d=0;for(let i=1;i<p.length;i++)d+=dist(p[i-1],p[i]);tip.textContent=fmtDistance(d);}if(mode==='measure-area'){temp=L.polygon(p,{color:'#ffd84d',fillOpacity:.1,dashArray:'6 5'}).addTo(map);tip.textContent=fmtArea(polyArea(p));}});
map.on('dblclick',e=>{if(!mode)return;L.DomEvent.stop(e);if(pts.length){if(mode==='draw-line'&&pts.length>1)L.polyline(pts,{color:'#ff3b30'}).addTo(drawGroup);if(mode==='draw-polygon'&&pts.length>2)L.polygon(pts,{color:'#ff3b30',fillOpacity:.12}).addTo(drawGroup);if(mode==='measure-length'&&pts.length>1){const l=L.polyline(pts,{color:'#ffd84d'}).addTo(measureGroup);let d=0;for(let i=1;i<pts.length;i++)d+=dist(pts[i-1],pts[i]);measureResult.textContent='Chiều dài: '+fmtDistance(d);measureResult.classList.add('show');}if(mode==='measure-area'&&pts.length>2){L.polygon(pts,{color:'#ffd84d',fillOpacity:.12}).addTo(measureGroup);measureResult.textContent='Diện tích: '+fmtArea(polyArea(pts));measureResult.classList.add('show');}}resetMode();});

// Locate
let locateLayer=null;document.getElementById('locateBtn').onclick=()=>{if(!navigator.geolocation)return alert('Trình duyệt không hỗ trợ định vị.');navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(locateLayer)map.removeLayer(locateLayer);locateLayer=L.circleMarker(ll,{radius:8,color:'#ff3b30',fillColor:'#ffd84d',fillOpacity:1}).addTo(map);map.setView(ll,15)},()=>alert('Không lấy được vị trí hiện tại.'))};

// Route: public demo services
let routeLayer=null,routeMarkers=[],pickTarget=null;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{pickTarget=b.dataset.pick;closePanels()});map.on('click',e=>{if(!pickTarget)return;document.getElementById(pickTarget==='A'?'routeA':'routeB').value=e.latlng.lat.toFixed(6)+','+e.latlng.lng.toFixed(6);pickTarget=null});document.getElementById('swapRoute').onclick=()=>{const a=document.getElementById('routeA'),b=document.getElementById('routeB'),t=a.value;a.value=b.value;b.value=t};
async function geocode(v){const s=v.trim();const m=s.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);if(m)return [+m[1],+m[2]];const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(s),{headers:{'Accept':'application/json'}});const j=await r.json();if(!j.length)throw new Error('Không tìm thấy địa chỉ: '+s);return [+j[0].lat,+j[0].lon]}
document.getElementById('calcRoute').onclick=async()=>{const out=document.getElementById('routeResult');out.classList.add('show');out.textContent='Đang tính tuyến...';try{const A=await geocode(document.getElementById('routeA').value),B=await geocode(document.getElementById('routeB').value);const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${A[1]},${A[0]};${B[1]},${B[0]}?overview=full&geometries=geojson`),j=await r.json();if(!j.routes?.length)throw new Error('Không tìm được tuyến');if(routeLayer)map.removeLayer(routeLayer);routeMarkers.forEach(x=>map.removeLayer(x));routeMarkers=[];routeLayer=L.geoJSON(j.routes[0].geometry,{style:{color:'#ff3b30',weight:5,opacity:.9}}).addTo(map);routeMarkers=[L.marker(A).addTo(map),L.marker(B).addTo(map)];map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});out.textContent='Khoảng cách: '+(j.routes[0].distance/1000).toFixed(2)+' km · Thời gian dự kiến: '+Math.round(j.routes[0].duration/60)+' phút';}catch(err){out.textContent='Lỗi: '+err.message;}};
document.getElementById('clearRoute').onclick=()=>{if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}routeMarkers.forEach(x=>map.removeLayer(x));routeMarkers=[];document.getElementById('routeResult').classList.remove('show')};
})();
</script>
</body>
